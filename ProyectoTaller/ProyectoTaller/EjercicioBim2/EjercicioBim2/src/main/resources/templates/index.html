<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema Tienda</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body{ background:#eef2f1; }

        .sidebar{
            height:100vh;
            background:#354f52;
        }
        .sidebar button{
            width:100%;
            border:none;
            background:none;
            color:white;
            padding:12px;
            text-align:left;
        }
        .sidebar button:hover{
            background:#52796f;
        }
        .section{ display:none; }
    </style>
</head>
<body>

<!-- LOGIN -->
<div class="container" id="login">
    <div class="row justify-content-center mt-5">
        <div class="col-md-4">
            <div class="card p-4 text-center shadow">
                <i class="fas fa-user-lock fa-3x text-success"></i>
                <h3 class="mt-2">Login</h3>

                <input type="text" id="user" class="form-control my-2" placeholder="Usuario">
                <input type="password" id="pass" class="form-control my-2" placeholder="Contraseña">

                <button class="btn btn-success w-100" onclick="login()">Ingresar</button>
                <p id="error" class="text-danger mt-2"></p>
            </div>
        </div>
    </div>
</div>

<!-- MENU -->
<div id="menu" style="display:none;">

    <!-- NAVBAR SUPERIOR -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand"><i class="fas fa-store"></i> Sistema de Tienda</span>
            <button class="btn btn-danger" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Cerrar sesión
            </button>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">

            <!-- SIDEBAR -->
            <div class="col-md-2 sidebar text-white">
                <h5 class="text-center mt-3">Menú</h5>

                <button onclick="mostrar('clientes')"><i class="fas fa-users"></i> Clientes</button>
                <button onclick="mostrar('productos')"><i class="fas fa-box-open"></i> Productos</button>
                <button onclick="mostrar('detalleVenta')"><i class="fas fa-file-invoice"></i> Detalle Venta</button>
                <button onclick="mostrar('usuarios')"><i class="fas fa-user"></i> Usuarios</button>
                <button onclick="mostrar('ventas')"><i class="fas fa-cash-register"></i> Ventas</button>
            </div>

            <!-- CONTENIDO -->
            <div class="col-md-10 p-4">

                <!-- CLIENTES -->
                <div id="clientes" class="section">
                    <button class="btn btn-secondary mb-2" onclick="volverMenu()">
                        <i class="fas fa-arrow-left"></i> Volver al menú
                    </button>

                    <h3>Clientes</h3>
                    <table class="table table-striped">
                        <thead class="table-success">
                        <tr><th>ID</th><th>Nombre</th><th>Correo</th></tr>
                        </thead>
                        <tbody>
                        <tr><td>1</td><td>Juan</td><td>juan@gmail.com</td></tr>
                        </tbody>
                    </table>
                </div>

                <!-- PRODUCTOS -->
                <div id="productos" class="section">
                    <button class="btn btn-secondary mb-2" onclick="volverMenu()">
                        <i class="fas fa-arrow-left"></i> Volver al menú
                    </button>

                    <h3>Productos</h3>
                    <table class="table table-striped">
                        <thead class="table-primary">
                        <tr><th>ID</th><th>Nombre</th><th>Precio</th><th>Stock</th></tr>
                        </thead>
                        <tbody>
                        <tr><td>1</td><td>Camisa</td><td>Q120</td><td>20</td></tr>
                        </tbody>
                    </table>
                </div>

                <!-- DETALLE VENTA -->
                <div id="detalleVenta" class="section">
                    <button class="btn btn-secondary mb-2" onclick="volverMenu()">
                        <i class="fas fa-arrow-left"></i> Volver al menú
                    </button>

                    <h3>Detalle de Venta</h3>
                    <table class="table table-striped">
                        <thead class="table-warning">
                        <tr><th>ID</th><th>Producto</th><th>Cantidad</th><th>Subtotal</th></tr>
                        </thead>
                        <tbody>
                        <tr><td>1</td><td>Camisa</td><td>2</td><td>Q240</td></tr>
                        </tbody>
                    </table>
                </div>

                <!-- USUARIOS -->
                <div id="usuarios" class="section">
                    <button class="btn btn-secondary mb-2" onclick="volverMenu()">
                        <i class="fas fa-arrow-left"></i> Volver al menú
                    </button>

                    <h3>Usuarios</h3>
                    <table class="table table-striped">
                        <thead class="table-info">
                        <tr><th>ID</th><th>Usuario</th><th>Rol</th></tr>
                        </thead>
                        <tbody>
                        <tr><td>1</td><td>admin</td><td>Administrador</td></tr>
                        </tbody>
                    </table>
                </div>

                <!-- VENTAS -->
                <div id="ventas" class="section">
                    <button class="btn btn-secondary mb-2" onclick="volverMenu()">
                        <i class="fas fa-arrow-left"></i> Volver al menú
                    </button>

                    <h3>Ventas</h3>
                    <table class="table table-striped">
                        <thead class="table-danger">
                        <tr><th>ID</th><th>Cliente</th><th>Total</th><th>Fecha</th></tr>
                        </thead>
                        <tbody>
                        <tr><td>1</td><td>Juan</td><td>Q240</td><td>2026-04-08</td></tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>
</div>

<script>
    function login(){
        let u = document.getElementById('user').value;
        let p = document.getElementById('pass').value;

        if(u === 'admin' && p === '1234'){
            document.getElementById('login').style.display='none';
            document.getElementById('menu').style.display='block';
        }else{
            document.getElementById('error').innerText='Credenciales incorrectas';
        }
    }

    function logout(){
        document.getElementById('menu').style.display='none';
        document.getElementById('login').style.display='block';
    }

    function mostrar(sec){
        let sections = document.getElementsByClassName('section');

        for(let i=0;i<sections.length;i++){
            sections[i].style.display='none';
        }

        document.getElementById(sec).style.display='block';
    }

    function volverMenu(){
        let sections = document.getElementsByClassName('section');

        for(let i=0;i<sections.length;i++){
            sections[i].style.display='none';
        }
    }
</script>

</body>
</html>
